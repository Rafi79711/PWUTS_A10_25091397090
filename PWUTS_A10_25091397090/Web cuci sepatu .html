<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Clean - Jasa Cuci & Perawatan Sepatu</title>
    <!-- Memanggil library jQuery dari CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- =====================================================
         BAGIAN CSS (GABUNGAN DARI FILE style.css)
         Tema: Putih & Biru Bersih (NFR-012) & Responsif (NFR-005)
         ===================================================== -->
    <style>
        /* Reset dasar agar ukuran kotak (box-sizing) rapi */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #F4F7FB; /* Latar abu-abu sangat muda */
            color: #1E293B;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Container pembatas lebar halaman */
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 1. HEADER & NAVBAR */
        .navbar {
            background-color: #1E6091; /* Biru utama */
            color: #FFFFFF;
            border-bottom: 3px solid #154569;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
        }

        .brand a {
            text-decoration: none;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: #E0F2FE;
        }

        .nav-menu ul {
            list-style: none;
            display: flex;
            gap: 8px;
        }

        .nav-link {
            display: inline-block;
            text-decoration: none;
            color: #E0F2FE;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
        }

        .nav-link.active {
            background-color: #FFFFFF;
            color: #1E6091;
            font-weight: 600;
        }

        /* Tombol menu HP disembunyikan di layar laptop */
        .menu-toggle {
            display: none;
            background-color: #2563EB;
            color: #FFFFFF;
            border: 1px solid #E0F2FE;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* 2. LAYOUT UTAMA, CARD, & GRID */
        .main-content {
            flex: 1;
            padding: 28px 0;
        }

        .section-block {
            margin-bottom: 24px;
        }

        .section-header {
            margin-bottom: 16px;
        }

        .section-header h2 {
            color: #1E6091;
            margin-bottom: 4px;
        }

        .page-title-box {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #DCE3EB;
        }

        .page-title-box h1 {
            color: #1E6091;
            font-size: 1.6rem;
            margin-bottom: 4px;
        }

        .card {
            background-color: #FFFFFF;
            border: 1px solid #DCE3EB;
            border-radius: 6px;
            padding: 24px;
        }

        .card h2 {
            color: #1E6091;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        /* Hero Section di Beranda */
        .hero-section {
            background-color: #FFFFFF;
            border-left: 5px solid #1E6091;
            margin-bottom: 24px;
        }

        .hero-section h1 {
            color: #1E6091;
            font-size: 1.65rem;
            margin-bottom: 10px;
        }

        .hero-section p {
            color: #334155;
            margin-bottom: 18px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Sistem Grid Sederhana */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        /* 3. KARTU LAYANAN & TAHAPAN BERANDA */
        .service-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-badge {
            display: inline-block;
            align-self: flex-start;
            background-color: #E0F2FE;
            color: #1E6091;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .service-card h3 {
            color: #1E293B;
            margin-bottom: 8px;
        }

        .service-desc {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 14px;
        }

        .service-meta {
            border-top: 1px solid #DCE3EB;
            padding-top: 10px;
            font-size: 0.9rem;
        }

        /* 7 Tahapan di Beranda */
        .steps-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .step-box {
            background-color: #F8FAFC;
            border: 1px solid #DCE3EB;
            border-radius: 6px;
            padding: 14px;
        }

        .step-num {
            display: inline-block;
            width: 26px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            background-color: #1E6091;
            color: #FFFFFF;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .step-box strong {
            display: block;
            color: #1E6091;
            margin-bottom: 4px;
        }

        .step-box p {
            font-size: 0.85rem;
            color: #475569;
        }

        /* 4. TOMBOL (BUTTON) & FORM INPUT */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #2563EB;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #1D4ED8;
        }

        .btn-secondary {
            background-color: #FFFFFF;
            color: #1E6091;
            border-color: #1E6091;
        }

        .btn-secondary:hover {
            background-color: #E0F2FE;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.92rem;
            color: #1E293B;
        }

        .req {
            color: #DC2626;
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1E293B;
            background-color: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563EB;
            background-color: #F8FAFC;
        }

        .input-error {
            border-color: #DC2626 !important;
            background-color: #FEF2F2 !important;
        }

        .help-text {
            display: block;
            font-size: 0.8rem;
            color: #64748B;
            margin-top: 4px;
        }

        .error-msg {
            display: block;
            color: #DC2626;
            font-size: 0.82rem;
            font-weight: 500;
            margin-top: 4px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            padding: 8px 0;
        }

        .radio-label {
            font-weight: 400 !important;
            display: flex !important;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .form-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        /* 5. FITUR TRACKING & STEPPER 7 STATUS */
        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            margin-bottom: 12px;
        }

        .search-input-wrapper {
            flex: 1;
        }

        .sample-codes {
            background-color: #F8FAFC;
            border: 1px solid #DCE3EB;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-chip {
            background-color: #E0F2FE;
            color: #1E6091;
            border: 1px solid #BAE6FD;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-chip:hover {
            background-color: #BAE6FD;
        }

        .tracking-result {
            margin-top: 20px;
            border-top: 2px solid #DCE3EB;
            padding-top: 20px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #E0F2FE;
            padding: 14px 18px;
            border-radius: 6px;
            border: 1px solid #BAE6FD;
            margin-bottom: 16px;
        }

        .result-header h3 {
            color: #1E6091;
            font-size: 1.35rem;
        }

        .label-muted {
            display: block;
            font-size: 0.8rem;
            color: #475569;
        }

        .badge-status {
            display: inline-block;
            background-color: #1E6091;
            color: #FFFFFF;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .detail-grid {
            margin-bottom: 16px;
        }

        .detail-item {
            background-color: #F8FAFC;
            border: 1px solid #DCE3EB;
            padding: 10px 14px;
            border-radius: 6px;
        }

        .highlight-box {
            background-color: #E0F2FE;
            border-color: #93C5FD;
        }

        .detail-label {
            display: block;
            font-size: 0.8rem;
            color: #64748B;
        }

        .detail-val {
            font-size: 0.98rem;
            font-weight: 600;
            color: #1E293B;
        }

        .text-blue {
            color: #1E6091;
        }

        .detail-notes {
            background-color: #F8FAFC;
            border-left: 4px solid #2563EB;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 0.92rem;
        }

        /* Visualisasi 7 Tahapan Status */
        .timeline-section h4 {
            color: #1E6091;
            margin-bottom: 12px;
        }

        .status-stepper {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .stepper-item {
            border: 1px solid #DCE3EB;
            background-color: #F8FAFC;
            border-radius: 6px;
            padding: 10px 8px;
            text-align: center;
            font-size: 0.82rem;
            color: #64748B;
        }

        .stepper-circle {
            width: 28px;
            height: 28px;
            line-height: 26px;
            border-radius: 50%;
            border: 2px solid #CBD5E1;
            margin: 0 auto 6px auto;
            font-weight: 700;
            background-color: #FFFFFF;
        }

        /* Status yang sudah dilewati (Selesai) */
        .stepper-item.step-done {
            background-color: #F0F9FF;
            border-color: #93C5FD;
            color: #1E6091;
        }

        .stepper-item.step-done .stepper-circle {
            background-color: #2563EB;
            border-color: #2563EB;
            color: #FFFFFF;
        }

        /* Status yang sedang berlangsung saat ini (Aktif) */
        .stepper-item.step-current {
            background-color: #E0F2FE;
            border: 2px solid #1E6091;
            color: #1E6091;
            font-weight: 700;
        }

        .stepper-item.step-current .stepper-circle {
            background-color: #1E6091;
            border-color: #1E6091;
            color: #FFFFFF;
        }

        /* 6. HASIL KALKULATOR, ALERT, & TABEL */
        .calc-result-box {
            margin-top: 20px;
            background-color: #E0F2FE;
            border: 1px solid #93C5FD;
            border-radius: 6px;
            padding: 18px;
        }

        .calc-result-box h3 {
            color: #1E6091;
            margin-bottom: 12px;
            font-size: 1.15rem;
        }

        .calc-stat {
            background-color: #FFFFFF;
            border: 1px solid #DCE3EB;
            padding: 12px;
            border-radius: 6px;
        }

        .calc-label {
            display: block;
            font-size: 0.82rem;
            color: #64748B;
        }

        .calc-value {
            font-size: 1.15rem;
            color: #1E6091;
        }

        .calc-note {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #1E293B;
        }

        /* Kotak Alert / Notifikasi */
        .alert {
            padding: 14px 16px;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 0.92rem;
        }

        .alert-danger {
            background-color: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #991B1B;
        }

        .alert-success {
            background-color: #F0FDF4;
            border: 1px solid #86EFAC;
            color: #166534;
        }

        .summary-box {
            margin-top: 10px;
            background-color: #FFFFFF;
            border: 1px solid #BBF7D0;
            padding: 12px;
            border-radius: 6px;
            color: #1E293B;
            font-size: 0.88rem;
        }

        .loading-box {
            background-color: #E0F2FE;
            color: #1E6091;
            border: 1px solid #93C5FD;
            padding: 10px 16px;
            border-radius: 6px;
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
        }

        /* Tabel Riwayat Data */
        .table-responsive {
            overflow-x: auto;
            margin-top: 14px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .data-table th,
        .data-table td {
            border: 1px solid #DCE3EB;
            padding: 10px 12px;
            text-align: left;
        }

        .data-table th {
            background-color: #1E6091;
            color: #FFFFFF;
            font-weight: 600;
        }

        .data-table tbody tr:nth-child(even) {
            background-color: #F8FAFC;
        }

        .data-table tbody tr:hover {
            background-color: #E0F2FE;
        }

        /* 7. FOOTER */
        .footer {
            background-color: #FFFFFF;
            border-top: 1px solid #DCE3EB;
            padding: 18px 0;
            text-align: center;
            font-size: 0.85rem;
            color: #475569;
            margin-top: auto;
        }

        /* 8. MEDIA QUERY RESPONSIVE (HP & TABLET - NFR-005) */
        @media (max-width: 900px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }

            .status-stepper {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .menu-toggle {
                display: block;
            }

            .nav-container {
                flex-wrap: wrap;
            }

            .nav-menu {
                display: none;
                width: 100%;
                margin-top: 12px;
            }

            .nav-menu.show-menu {
                display: block;
            }

            .nav-menu ul {
                flex-direction: column;
                gap: 6px;
            }

            .nav-link {
                display: block;
            }

            .grid-2,
            .grid-3,
            .grid-4,
            .status-stepper {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- =====================================================
         BAGIAN HEADER & NAVBAR UTAMA (SOAL UTS 2.a)
         ===================================================== -->
    <header class="navbar">
        <div class="container nav-container">
            <div class="brand">
                <a class="nav-link-logo" data-page="beranda">
                    <span class="brand-title">STEP CLEAN</span>
                    <span class="brand-subtitle">Shoe Care & Laundry</span>
                </a>
            </div>

            <!-- Tombol menu untuk tampilan HP (Responsive) -->
            <button type="button" class="menu-toggle" id="btn-menu-hp">Menu</button>

            <nav class="nav-menu" id="nav-list">
                <ul>
                    <li><a href="#beranda" class="nav-link active" data-page="beranda">Beranda</a></li>
                    <li><a href="#tracking" class="nav-link" data-page="tracking.html">Tracking & Estimasi</a></li>
                    <li><a href="#form-estimasi" class="nav-link" data-page="form-estimasi.html">Form Update Status</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Indikator Loading saat perpindahan halaman Ajax -->
    <div class="container">
        <div id="loading-bar" class="loading-box" style="display: none;">
            Memuat halaman via Ajax, mohon tunggu...
        </div>
    </div>

    <!-- =====================================================
         AREA KONTEN UTAMA (DIMUAT DINAMIS DENGAN AJAX)
         ===================================================== -->
    <main id="konten-utama" class="container main-content">
        <!-- Diisi otomatis saat pertama kali dibuka dari template Beranda -->
    </main>

    <!-- =====================================================
         BAGIAN FOOTER
         ===================================================== -->
    <footer class="footer">
        <div class="container">
            <p><strong>Step Clean - Sistem Informasi Jasa Cuci & Perawatan Sepatu</strong></p>
            <p>Proyek UTS Pemrograman Web - Kelompok 10 (Kelas 2025C) D4 Manajemen Informatika UNESA &copy; 2026</p>
        </div>
    </footer>


    <!-- =====================================================
         TEMPLATE 1: HALAMAN BERANDA (DEFAULT - SOAL 2.a)
         ===================================================== -->
    <script type="text/template" id="tpl-beranda">
        <div id="isi-beranda">
            <!-- Hero / Pengenalan Singkat -->
            <section class="card hero-section">
                <h1>Step Clean - Layanan Cuci Sepatu & Tracking Pesanan</h1>
                <p>
                    Selamat datang di sistem informasi layanan perawatan sepatu Step Clean. 
                    Melalui website ini, pelanggan dapat melihat daftar layanan, menghitung perkiraan waktu selesai, 
                    serta memantau status pengerjaan sepatu secara langsung menggunakan Nomor Pesanan atau Nomor WhatsApp 
                    tanpa harus datang ke toko.
                </p>
                <div class="hero-actions">
                    <a href="#tracking" class="btn btn-primary btn-pindah-ajax" data-target="tracking.html">Cek Status & Estimasi</a>
                    <a href="#form-estimasi" class="btn btn-secondary btn-pindah-ajax" data-target="form-estimasi.html">Input / Update Pesanan (Admin)</a>
                </div>
            </section>

            <!-- Ringkasan Layanan & Paket Harga (FR-001 & FR-002) -->
            <section class="section-block">
                <div class="section-header">
                    <h2>Daftar Layanan & Estimasi Pengerjaan</h2>
                    <p>Pilihan paket perawatan sepatu sesuai kebutuhan Anda dengan harga transparan.</p>
                </div>

                <div class="grid-4">
                    <div class="card service-card">
                        <div class="service-badge">Layanan Cepat</div>
                        <h3>Fast Clean</h3>
                        <p class="service-desc">Pencucian cepat bagian luar sepatu (upper dan midsole) untuk sepatu yang tidak terlalu kotor.</p>
                        <div class="service-meta">
                            <p><strong>Harga:</strong> Rp 35.000 / pasang</p>
                            <p><strong>Estimasi:</strong> 1 Hari Kerja</p>
                        </div>
                    </div>

                    <div class="card service-card">
                        <div class="service-badge">Paling Diminati</div>
                        <h3>Deep Clean</h3>
                        <p class="service-desc">Pencucian menyeluruh seluruh bagian sepatu (upper, midsole, outsole, insole, dan tali sepatu).</p>
                        <div class="service-meta">
                            <p><strong>Harga:</strong> Rp 50.000 / pasang</p>
                            <p><strong>Estimasi:</strong> 3 Hari Kerja</p>
                        </div>
                    </div>

                    <div class="card service-card">
                        <div class="service-badge">Perawatan Khusus</div>
                        <h3>Unyellowing</h3>
                        <p class="service-desc">Perawatan khusus untuk menghilangkan noda kuning (oksidasi) pada bagian midsole sepatu putih.</p>
                        <div class="service-meta">
                            <p><strong>Harga:</strong> Rp 65.000 / pasang</p>
                            <p><strong>Estimasi:</strong> 4 Hari Kerja</p>
                        </div>
                    </div>

                    <div class="card service-card">
                        <div class="service-badge">Restorasi Warna</div>
                        <h3>Repaint</h3>
                        <p class="service-desc">Pewarnaan ulang sepatu yang sudah pudar menggunakan cat khusus sepatu agar kembali seperti baru.</p>
                        <div class="service-meta">
                            <p><strong>Harga:</strong> Rp 120.000 / pasang</p>
                            <p><strong>Estimasi:</strong> 7 Hari Kerja</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Daftar Tahapan Pencucian & Status Pesanan (7 Status Proposal) -->
            <section class="section-block">
                <div class="card">
                    <h2>Alur Tahapan Status Pesanan di Step Clean</h2>
                    <p>Setiap sepatu yang masuk ke Step Clean akan melewati 7 tahapan status yang tercatat di sistem:</p>
                    
                    <div class="steps-overview">
                        <div class="step-box">
                            <span class="step-num">1</span>
                            <strong>Menunggu Konfirmasi</strong>
                            <p>Pesanan telah masuk sistem dan menunggu verifikasi admin.</p>
                        </div>
                        <div class="step-box">
                            <span class="step-num">2</span>
                            <strong>Dijemput</strong>
                            <p>Kurir toko sedang menjemput sepatu ke alamat pelanggan (jika pilih pickup).</p>
                        </div>
                        <div class="step-box">
                            <span class="step-num">3</span>
                            <strong>Diterima Toko</strong>
                            <p>Sepatu sudah berada di workshop Step Clean dan siap masuk antrean cuci.</p>
                        </div>
                        <div class="step-box">
                            <span class="step-num">4</span>
                            <strong>Sedang Dicuci</strong>

            // =====================================================
            $(document).on("click", ".nav-link, .btn-pindah-ajax, .nav-link-logo", function (e) {
                var targetPage = $(this).attr("data-page") || $(this).attr("data-target");

                if (!targetPage) {
                    return;
                }

                e.preventDefault(); // Mencegah reload halaman penuh

                // Tutup menu HP jika sedang terbuka
                $("#nav-list").removeClass("show-menu");

                // Update tampilan class active pada menu navbar
                $(".nav-link").removeClass("active");
                $('.nav-link[data-page="' + targetPage + '"]').addClass("active");

                // Tentukan ID template pendamping (untuk mode 1 file)
                var idTemplate = "#tpl-beranda";
                if (targetPage === "tracking.html") {
                    idTemplate = "#tpl-tracking";
                } else if (targetPage === "form-estimasi.html") {
                    idTemplate = "#tpl-form-estimasi";
                }

                // Jika memilih Beranda, langsung tampilkan isi Beranda
                if (targetPage === "beranda") {
                    $("#konten-utama").hide().html($(idTemplate).html()).fadeIn(200);
                    window.scrollTo(0, 0);

                // Tampilkan indikator loading
                $("#loading-bar").show();

                // baik saat dijalankan di satu file maupun di Live Server
                var htmlKonten = $(idTemplate).html();
                var blob = new Blob([htmlKonten], { type: "text/html" });
                var ajaxUrl = URL.createObjectURL(blob);

                // Panggil halaman menggunakan fungsi jQuery $.ajax()

                    url: ajaxUrl,
                    type: "GET",
                    dataType: "html",
                    success: function (response) {
                        $("#loading-bar").hide();

                        setTanggalDefault();
                        renderTabelRiwayat();
                        window.scrollTo(0, 0);
                    },
                    error: function () {
                        // Fallback langsung ke template jika browser membatasi Blob URL
                        $("#loading-bar").hide();
                        $("#konten-utama").hide().html(htmlKonten).fadeIn(200);
                        setTanggalDefault();
                        renderTabelRiwayat();

                $("#detail-kode").text(pesananDitemukan.order_code);
                $("#detail-status-badge").text(pesananDitemukan.status);
                $("#detail-nama").text(pesananDitemukan.customer_name);
                $("#detail-wa").text(pesananDitemukan.whatsapp);
                $("#detail-sepatu").text(pesananDitemukan.shoe_type);
                $("#detail-layanan").text(pesananDitemukan.service_name + " (" + pesananDitemukan.shoe_count + " Pasang)");
                $("#detail-metode").text("Pickup: " + pesananDitemukan.pickup_method + " | Pengembalian: " + pesananDitemukan.delivery_method);
                $("#detail-biaya").text(formatRupiah(pesananDitemukan.total_price));
                $("#detail-tgl-masuk").text(pesananDitemukan.order_date);
                $("#detail-tgl-estimasi").text(pesananDitemukan.estimated_completion);
                $("#detail-catatan").text(pesananDitemukan.notes);

                // Bangun visualisasi 7 tahapan status pesanan
                var indexStatusAktif = daftarStatusResmi.indexOf(pesananDitemukan.status);
                var htmlStepper = "";

                for (var j = 0; j < daftarStatusResmi.length; j++) {
                    var namaTahap = daftarStatusResmi[j];
                    var classTahap = "";

                    if (j < indexStatusAktif) {
                        classTahap = "step-done"; // Tahap sudah terlewati
                    } else if (j === indexStatusAktif) {
                        classTahap = "step-current"; // Tahap saat ini
                    }

                    htmlStepper +=
                        '<div class="stepper-item ' + classTahap + '">' +
                        '<div class="stepper-circle">' + (j + 1) + '</div>' +
                        '<div class="stepper-label">' + namaTahap + '</div>' +
                        '</div>';
                }

                $("#daftar-tahapan-status").html(htmlStepper);
                $("#hasil-tracking-box").fadeIn(200);
            });

            // Tombol Reset pada fitur Tracking
            $(document).on("click", "#btn-reset-tracking", function () {
                $("#input-kata-kunci").val("");
                $("#alert-tracking-gagal").hide();
                $("#hasil-tracking-box").hide();
            });

            // =====================================================
            // 4. FITUR 2: KALKULATOR ESTIMASI SELESAI (FR-007)
            // =====================================================
            $(document).on("submit", "#form-kalkulator-estimasi", function (e) {
                e.preventDefault();

                var tglMasukStr = $("#calc-tgl-masuk").val();
                var opsiLayanan = $("#calc-layanan option:selected");
                var namaLayanan = opsiLayanan.val();
                var durasiDasar = parseInt(opsiLayanan.attr("data-hari"), 10);
                var hargaSatuan = parseInt(opsiLayanan.attr("data-harga"), 10);

                var jumlahSepatu = parseInt($("#calc-jumlah").val(), 10) || 1;
                var opsiDelivery = $("#calc-pengembalian option:selected");
                var metodeDelivery = opsiDelivery.val();
                var biayaOngkir = parseInt(opsiDelivery.attr("data-ongkir"), 10) || 0;

                if (!tglMasukStr) {
                    alert("Silakan pilih Tanggal Rencana Masuk terlebih dahulu.");
                    return;
                }

                // Tambahan 1 hari kerja apabila mencuci lebih dari 3 pasang sepatu
                var tambahanHari = jumlahSepatu > 3 ? 1 : 0;
                var totalHari = durasiDasar + tambahanHari;

                // Hitung tanggal selesai
                var tglMasukObj = new Date(tglMasukStr);
                tglMasukObj.setDate(tglMasukObj.getDate() + totalHari);
                var tglSelesaiStr = formatTanggalYYYYMMDD(tglMasukObj);

                // Hitung total biaya
                var totalBiaya = (hargaSatuan * jumlahSepatu) + biayaOngkir;

                // Tampilkan hasil ke layar menggunakan jQuery
                $("#out-durasi").text(totalHari + " Hari Kerja");
                $("#out-tgl-selesai").text(tglSelesaiStr);
                $("#out-total-biaya").text(formatRupiah(totalBiaya));

                var infoTambahan = "Layanan " + namaLayanan + " untuk " + jumlahSepatu + " pasang sepatu (" + metodeDelivery + ").";
                if (tambahanHari > 0) {
                    infoTambahan += " Termasuk tambahan waktu 1 hari karena jumlah sepatu lebih dari 3 pasang.";
                }
                $("#out-rincian-teks").text(infoTambahan);

                $("#hasil-kalkulator-box").hide().fadeIn(200);
            });

            // =====================================================
            // 5. VALIDASI FORM TRANSAKSI & UPDATE STATUS (SOAL 2.c)
            // =====================================================
            $(document).on("submit", "#form-update-status", function (e) {
                e.preventDefault(); // Mencegah reload halaman

                // Bersihkan pesan error sebelumnya
                $(".error-msg").text("");
                $(".form-control").removeClass("input-error");
                $("#kotak-sukses-form").hide();

                // Ambil nilai dari semua field form
                var orderCode = $.trim($("#order_code").val()).toUpperCase();
                var whatsapp = $.trim($("#whatsapp").val());
                var serviceId = $("#service_id").val();
                var serviceName = $("#service_id option:selected").attr("data-nama") || "";
                var serviceHarga = parseInt($("#service_id option:selected").attr("data-harga"), 10) || 0;
                var shoeCount = $.trim($("#shoe_count").val());
                var orderDate = $("#order_date").val();
                var estimatedCompletion = $("#estimated_completion").val();
                var statusPesanan = $("#status").val();
                var deliveryMethod = $('input[name="delivery_method"]:checked').val();
                var notes = $.trim($("#notes").val());

                var isValid = true;

                // 1. Validasi Kode Pesanan (Wajib diisi & harus diawali ORD-)
                if (orderCode === "") {
                    tampilkanError("order_code", "Kode pesanan wajib diisi.");
                    isValid = false;
                } else if (orderCode.indexOf("ORD-") !== 0 || orderCode.length < 5) {
                    tampilkanError("order_code", "Format kode pesanan harus diawali 'ORD-' diikuti nomor (contoh: ORD-004).");
                    isValid = false;
                }

                // 2. Validasi Nomor WhatsApp (Wajib diisi, hanya angka, 10-14 digit)
                var regexAngka = /^[0-9]+$/;
                if (whatsapp === "") {
                    tampilkanError("whatsapp", "Nomor WhatsApp pelanggan wajib diisi.");
                    isValid = false;
                } else if (!regexAngka.test(whatsapp)) {
                    tampilkanError("whatsapp", "Nomor WhatsApp hanya boleh berisi angka tanpa spasi atau tanda hubung.");
                    isValid = false;
                } else if (whatsapp.length < 10 || whatsapp.length > 14) {
                    tampilkanError("whatsapp", "Panjang nomor WhatsApp harus antara 10 sampai 14 digit.");
                    isValid = false;
                }

                // 3. Validasi Pilihan Layanan
                if (!serviceId || serviceId === "") {
                    tampilkanError("service_id", "Silakan pilih salah satu layanan cuci sepatu.");
                    isValid = false;
                }

                // 4. Validasi Jumlah Sepatu (Minimal 1)
                var jmlSepatuInt = parseInt(shoeCount, 10);
                if (shoeCount === "" || isNaN(jmlSepatuInt) || jmlSepatuInt < 1) {
                    tampilkanError("shoe_count", "Jumlah sepatu wajib diisi minimal 1 pasang.");
                    isValid = false;
                }

                // 5. Validasi Tanggal Pesanan Masuk
                if (!orderDate) {
                    tampilkanError("order_date", "Tanggal pesanan masuk wajib diisi.");
                    isValid = false;
                }

                // 6. Validasi Estimasi Tanggal Selesai & Logika Tanggal
                if (!estimatedCompletion) {
                    tampilkanError("estimated_completion", "Estimasi tanggal selesai wajib diisi.");
                    isValid = false;
                } else if (orderDate && estimatedCompletion < orderDate) {
                    tampilkanError("estimated_completion", "Tanggal estimasi selesai tidak boleh lebih awal dari tanggal pesanan masuk.");
                    isValid = false;
                }

                // 7. Validasi Status Pesanan
                if (!statusPesanan || statusPesanan === "") {
                    tampilkanError("status", "Silakan pilih status pengerjaan pesanan saat ini.");
                    isValid = false;
                }

                // 8. Validasi Metode Pengembalian (Radio Button)
                if (!deliveryMethod) {
                    $("#err-delivery_method").text("Silakan pilih metode pengembalian sepatu (Ambil Sendiri / Diantar).");
                    isValid = false;
                }

                // 9. Validasi Catatan / Pesan Notifikasi
                if (notes === "") {
                    tampilkanError("notes", "Catatan atau pesan notifikasi status wajib diisi.");
                    isValid = false;
                }

                // Jika ada field yang belum valid, hentikan proses penyimpanan
                if (!isValid) {
                    return;
                }

                // Hitung total harga otomatis berdasarkan layanan & metode pengembalian
                var ongkir = deliveryMethod === "Diantar" ? 10000 : 0;
                var totalHarga = (serviceHarga * jmlSepatuInt) + ongkir;

                // Periksa apakah order_code sudah ada di array (Jika ada: update, jika belum: tambahkan baru)
                var indeksAda = -1;
                for (var i = 0; i < dataPesanan.length; i++) {
                    if (dataPesanan[i].order_code.toUpperCase() === orderCode) {
                        indeksAda = i;
                        break;
                    }
                }

                var objekDataBaru = {
                    order_code: orderCode,
                    customer_name: indeksAda !== -1 ? dataPesanan[indeksAda].customer_name : "Pelanggan Step Clean",
                    whatsapp: whatsapp,
                    shoe_type: indeksAda !== -1 ? dataPesanan[indeksAda].shoe_type : "Sepatu Pelanggan",
                    service_id: parseInt(serviceId, 10),
                    service_name: serviceName,
                    shoe_count: jmlSepatuInt,
                    order_date: orderDate,
                    estimated_completion: estimatedCompletion,
                    status: statusPesanan,
                    pickup_method: indeksAda !== -1 ? dataPesanan[indeksAda].pickup_method : "Antar Sendiri",
                    delivery_method: deliveryMethod,
                    total_price: totalHarga,
                    notes: notes
                };

                if (indeksAda !== -1) {
                    dataPesanan[indeksAda] = objekDataBaru;
                } else {
                    dataPesanan.push(objekDataBaru);
                }

                // Tampilkan ringkasan data yang valid
                var htmlRingkasan =
                    "<strong>Kode Pesanan:</strong> " + objekDataBaru.order_code + " | " +
                    "<strong>WhatsApp:</strong> " + objekDataBaru.whatsapp + "<br>" +
                    "<strong>Layanan:</strong> " + objekDataBaru.service_name + " (" + objekDataBaru.shoe_count + " pasang) | " +
                    "<strong>Total Biaya:</strong> " + formatRupiah(objekDataBaru.total_price) + "<br>" +
                    "<strong>Tanggal Masuk:</strong> " + objekDataBaru.order_date + " | " +
                    "<strong>Estimasi Selesai:</strong> " + objekDataBaru.estimated_completion + "<br>" +
                    "<strong>Status Terbaru:</strong> " + objekDataBaru.status + " | " +
                    "<strong>Pengembalian:</strong> " + objekDataBaru.delivery_method + "<br>" +
                    "<strong>Pesan Notifikasi:</strong> " + objekDataBaru.notes;

                $("#ringkasan-data-valid").html(htmlRingkasan);
                $("#kotak-sukses-form").fadeIn(200);

                // Perbarui tabel riwayat di bawah form
                renderTabelRiwayat();
            });

            // Tombol Bersihkan Form
            $(document).on("click", "#btn-bersihkan-form", function () {
                $(".error-msg").text("");
                $(".form-control").removeClass("input-error");
                $("#kotak-sukses-form").hide();
            });
        });

        // =====================================================
        // FUNGSI PEMBANTU (HELPER FUNCTIONS)
        // =====================================================

        // Fungsi menampilkan pesan error spesifik di bawah input
        function tampilkanError(idField, pesan) {
            $("#" + idField).addClass("input-error");
            $("#err-" + idField).text(pesan);
        }

        // Fungsi merender daftar pesanan ke dalam tabel riwayat
        function renderTabelRiwayat() {
            if ($("#isi-tabel-riwayat").length === 0) {
                return;
            }

            var barisHtml = "";
            for (var i = 0; i < dataPesanan.length; i++) {
                var d = dataPesanan[i];
                barisHtml +=
                    "<tr>" +
                    "<td><strong>" + d.order_code + "</strong></td>" +
                    "<td>" + d.whatsapp + "</td>" +
                    "<td>" + d.service_name + "</td>" +
                    "<td>" + d.shoe_count + " psg</td>" +
                    "<td>" + d.order_date + "</td>" +
                    "<td>" + d.estimated_completion + "</td>" +
                    "<td><span class='badge-status' style='font-size:0.78rem; padding:3px 8px;'>" + d.status + "</span></td>" +
                    "<td>" + d.delivery_method + "</td>" +
                    "<td>" + d.notes + "</td>" +
                    "</tr>";
            }

            $("#isi-tabel-riwayat").html(barisHtml);
        }

        // Fungsi mengisi tanggal hari ini secara otomatis pada input date kosong
        function setTanggalDefault() {
            var hariIni = formatTanggalYYYYMMDD(new Date());
            if ($("#calc-tgl-masuk").length > 0 && !$("#calc-tgl-masuk").val()) {
                $("#calc-tgl-masuk").val(hariIni);
            }
            if ($("#order_date").length > 0 && !$("#order_date").val()) {
                $("#order_date").val(hariIni);
            }
        }

        // Fungsi mengubah objek Date menjadi string YYYY-MM-DD
        function formatTanggalYYYYMMDD(dateObj) {
            var tahun = dateObj.getFullYear();
            var bulan = String(dateObj.getMonth() + 1).padStart(2, "0");
            var tanggal = String(dateObj.getDate()).padStart(2, "0");
            return tahun + "-" + bulan + "-" + tanggal;
        }

        // Fungsi mengubah angka menjadi format Rupiah sederhana
        function formatRupiah(angka) {
            return "Rp " + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }
    </script>
</body>
</html>
